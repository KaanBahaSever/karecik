name: CI

# Railway deploys straight from GitHub on every push to main. This workflow is
# what makes that safe: it is the gate that runs BEFORE a deploy can be trusted,
# and it costs nothing — GitHub Actions is free for public repositories and has
# a generous free allowance for private ones.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go — vet, test, build
    runs-on: ubuntu-latest

    # The tenant-isolation suite skips itself when no database is reachable,
    # which would make this job green while proving nothing. A service
    # container costs nothing here and lets it actually run: it creates its own
    # scratch database per run and drops it afterwards.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: go test
        working-directory: backend
        env:
          KARECIK_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -count=1 ./...

      # Sessions live in a map shared by every request-handling goroutine, so a
      # missing lock here is an authentication bug that only shows up under
      # load. The race detector is the only thing that reliably catches it, and
      # it costs a second on one small package.
      - name: go test -race (session store)
        working-directory: backend
        run: go test -race -count=1 ./internal/session/...

      - name: Fail if the isolation suite skipped
        working-directory: backend
        env:
          KARECIK_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        # `shell: bash` is not decoration. The default shell for a `run:` step is
        # `bash -e {0}` WITHOUT pipefail, so the exit status of `go test | tee` is
        # tee's — always 0 — and this step would swallow an outright test failure
        # while claiming to guard the suite. Naming the shell explicitly turns on
        # `-o pipefail`, so go test's own failure propagates.
        shell: bash
        # A skipped security test is worse than a missing one: it reports green.
        # `go test -v` prints "--- SKIP" for a skipped case, so the run is failed
        # explicitly if the cross-tenant checks did not actually execute.
        run: |
          go test -count=1 -v ./tests/... | tee /tmp/tests.log
          if grep -q -- "--- SKIP" /tmp/tests.log; then
            echo "::error::The tenant-isolation suite skipped — it must run in CI."
            exit 1
          fi

      - name: go build
        working-directory: backend
        run: go build ./...

  frontend:
    name: React — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: npm run build
        working-directory: frontend
        run: npm run build

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    # Building the real image catches what the Go and React jobs cannot: a
    # broken COPY path, a stage that does not compile under Alpine, or an npm ci
    # that resolves differently on musl than it does on a developer's machine.
    # It is not pushed — Railway builds its own from the same file.
    #
    # The image carries BOTH halves again: the SPA is built in and served by the
    # Go binary, so this job depends on both. Its two `test -f` guards fail the
    # build if the bundle did not land where the server looks for it, which is
    # the failure this pipeline most needs to catch before Railway does.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
